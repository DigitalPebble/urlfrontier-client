[package]
name = "urlfrontier-client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "uf"
path = "src/main.rs"

[build-dependencies]
# protobuf->Rust compiler
tonic-build = "0.8.3"
# serde implementations of the protobuf JSON mapping
pbjson-build = "0.5.1"

[dependencies]
chrono = "0.4"
clap = { version = "4.0.29", features = ["derive"] }
flate2 = "1"
pbjson = "0.5.1"
prost = "0.11.3"
serde = "1"
serde_json = "1"
tokio = { version = "1.22.0", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tokio-stream = "0.1"
tonic = "0.8.3"
